<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PesateAI · Acceso</title>
  <style>:root{--ink:#172331;--muted:#728091;--line:#dce3e8;--blue:#2776db;--paper:#f5f7f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#eef4fb,#f7f9fa);color:var(--ink);font:14px Inter,system-ui,sans-serif}.shell{width:min(920px,calc(100% - 32px));display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 22px 70px #1723311c}.intro{padding:54px;background:#13202d;color:#fff}.brand{display:flex;align-items:center;gap:10px;font-size:21px}.brand b{display:grid;place-items:center;width:34px;height:34px;background:var(--blue);border-radius:8px}.intro h1{font-size:34px;line-height:1.08;margin:55px 0 16px}.intro p{color:#b7c4cf;line-height:1.6}.form{padding:50px 44px}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:#8494a4}.form h2{font-size:25px;margin:8px 0 25px}.tabs{display:flex;gap:7px;margin-bottom:23px}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:5px;color:var(--muted);cursor:pointer}.tab.active{background:#e7f0ff;color:var(--blue);border-color:#b9d1f2}label{display:block;margin:15px 0 7px;color:var(--muted);font-size:12px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;font:inherit}.primary{width:100%;margin-top:22px;border:0;background:var(--blue);color:#fff;padding:12px;border-radius:6px;font-weight:750;cursor:pointer}.message{min-height:22px;color:#b23b46;margin-top:14px;font-size:12px}@media(max-width:700px){.shell{grid-template-columns:1fr}.intro{padding:30px}.intro h1{margin:25px 0 10px;font-size:27px}.form{padding:34px 28px}}</style>
</head>
<body><main class="shell"><section class="intro"><div class="brand"><b>P</b><strong>PesateAI</strong></div><h1>Tu seguimiento, en un solo lugar.</h1><p>Guarda de forma privada tu peso, alimentos y actividad física a lo largo del tiempo.</p></section><section class="form"><div class="eyebrow">CUENTA LOCAL</div><h2 id="form-title">Iniciar sesión</h2><div class="tabs"><button class="tab active" id="login-tab">Entrar</button><button class="tab" id="register-tab">Crear cuenta</button></div><form id="auth-form"><label for="username">Usuario</label><input id="username" autocomplete="username" minlength="3" maxlength="64" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="primary" id="submit-button" type="submit">Entrar</button><p class="message" id="message"></p></form></section></main>
<script>let mode='login';const loginTab=document.getElementById('login-tab'),registerTab=document.getElementById('register-tab'),title=document.getElementById('form-title'),submit=document.getElementById('submit-button'),password=document.getElementById('password'),message=document.getElementById('message');function setMode(next){mode=next;loginTab.classList.toggle('active',mode==='login');registerTab.classList.toggle('active',mode==='register');title.textContent=mode==='login'?'Iniciar sesión':'Crear cuenta';submit.textContent=mode==='login'?'Entrar':'Registrar cuenta';password.autocomplete=mode==='login'?'current-password':'new-password';message.textContent=''}loginTab.onclick=()=>setMode('login');registerTab.onclick=()=>setMode('register');document.getElementById('auth-form').onsubmit=async event=>{event.preventDefault();message.textContent='';submit.disabled=true;try{const response=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:password.value})});const payload=await response.json();if(!response.ok)throw new Error(payload.detail||'No se pudo completar la operación.');location.href='/'}catch(error){message.textContent=error.message}finally{submit.disabled=false}};</script></body></html>
